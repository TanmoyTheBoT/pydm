name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        shell: bash
        run: |
          uv python install 3.12

      - name: Install dependencies
        shell: bash
        run: |
          uv sync
          uv pip install nuitka pyinstaller

      - name: Read version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import pathlib
          ns = {}
          exec(pathlib.Path("src/pydm/version.py").read_text(encoding="utf-8"), ns)
          print(ns.get("__version__", "0.0.1"))
          PY
          )
          echo "PYDM_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}

      - name: Build portable package
        shell: bash
        run: |
          mkdir -p release-assets
          make portable
          cp dist/PyDM-v${{ env.PYDM_VERSION }}-Windows-x64-Portable.zip release-assets/ || true

      - name: Build portable PyInstaller package
        shell: bash
        run: |
          make portable-pyinstaller
          cp dist/PyDM-v${{ env.PYDM_VERSION }}-Windows-x64-Portable-Pyinstaller.zip release-assets/ || true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
            if (Test-Path "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe") {
              Write-Host "ISCC found at $env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
            } else {
              throw "Inno Setup compiler not found after installation"
            }
          }

      - name: Build installer
        shell: bash
        run: |
          make installer

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            release-assets/PyDM-v${{ env.PYDM_VERSION }}-Windows-x64-Portable.zip
            release-assets/PyDM-v${{ env.PYDM_VERSION }}-Windows-x64-Portable-Pyinstaller.zip
            dist/PyDM-v${{ env.PYDM_VERSION }}-Windows-x64-Installer.exe

